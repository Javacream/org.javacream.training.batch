global:
  scrape_interval:     15s 

scrape_configs:

  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  # batch
  - job_name: 'batch'
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
    - targets: ['10.160.1.83:8080']
    

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

